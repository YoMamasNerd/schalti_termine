name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-dummy-key-not-used-in-production
      SQLITE_PATH: ":memory:"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Django system checks
        run: python manage.py check

      - name: Migrationen sind konsistent (makemigrations --check)
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        run: python manage.py test -v 1

  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # Der SSH-Key ist auf dem Server per "command=" in authorized_keys auf
      # genau ein Skript (/home/termine/deploy.sh) beschraenkt - selbst bei
      # Leak des Keys sind keine anderen Befehle auf dem Server ausfuehrbar.
      - name: Deploy per SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          script: deploy

