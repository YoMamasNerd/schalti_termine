<div id="flash-messages" hx-swap-oob="true">
  {% for message in messages %}
    <sl-alert variant="{% if message.tags == 'error' %}danger{% elif message.tags == 'success' %}success{% else %}primary{% endif %}" open closable duration="5000">
      <sl-icon slot="icon" name="info-circle"></sl-icon>
      {{ message }}
    </sl-alert>
  {% endfor %}
</div>
