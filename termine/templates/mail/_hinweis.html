{% comment %}
  Hinweiskasten wie .hinweis auf der Seite.

  Parameter:
    art     "erfolg", "warnung" oder leer für den neutralen Kasten
    titel   fetter Vorspann (freiwillig)
    text    der Hinweis selbst
{% endcomment %}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       class="m-{% if art %}{{ art }}{% else %}neutral{% endif %}"
       style="border-radius:6px; margin:0 0 20px;
              {% if art == 'erfolg' %}background-color:#d9ecc4; border:1px solid #4a7c2f;
              {% elif art == 'warnung' %}background-color:#ffebb6; border:1px solid #8a6100;
              {% else %}background-color:#ebefe7; border:1px solid #cfdbe2;{% endif %}">
  <tr>
    <td class="m-{% if art %}{{ art }}{% else %}text{% endif %}"
        style="padding:12px 16px; font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif; font-size:15px; line-height:1.5;
               {% if art == 'erfolg' %}color:#3f6329;
               {% elif art == 'warnung' %}color:#8a6100;
               {% else %}color:#2b5883;{% endif %}">
      {% if titel %}<strong>{{ titel }}</strong>{% if text %}<br>{% endif %}{% endif %}{{ text }}
    </td>
  </tr>
</table>
