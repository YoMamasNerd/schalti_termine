services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-termine}
      POSTGRES_USER: ${POSTGRES_USER:-termine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in der .env}
    volumes:
      - postgres-daten:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-termine}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - fsm-network
    ports:
      - "10.0.0.4:8001:8000"
      - "127.0.0.1:8001:8000"
    # Die Deployment-Prüfungen laufen zuerst: Zeigt SITE_BASE_URL noch auf
    # localhost oder fehlt der Mailversand, bricht der Start ab, statt später
    # unbrauchbare Bestätigungslinks zu verschicken.
    command: >
      sh -c "python manage.py check --deploy --fail-level ERROR &&
             python manage.py migrate --noinput &&
             python manage.py jobs_einrichten &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60 --access-logfile -"
    # Fragt die App über sich selbst ab: Antwortet gunicorn und ist die
    # Datenbank erreichbar? Ein reiner Prozess-Check würde beides verwechseln.
    # curl ist im Image nicht vorhanden – Python ist es ohnehin.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          try:
              sys.exit(0 if urllib.request.urlopen(
                  "http://127.0.0.1:8000/healthz", timeout=5).status == 200 else 1)
          except Exception:
              sys.exit(1)
      interval: 30s
      timeout: 10s
      retries: 3
      # Migration und Job-Einrichtung laufen vor gunicorn; bis dahin ist noch
      # nichts zu holen, ohne dass etwas kaputt wäre.
      start_period: 60s

  # Führt die wiederkehrenden Jobs aus: Vorausplanung, Erinnerungen,
  # Freigabe abgelaufener Reservierungen, Datenpflege.
  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
      # Nicht nur auf die Datenbank warten, sondern auf den Webserver: Dort
      # laufen Migration und Job-Einrichtung. Ohne diese Zeile startet der
      # Worker vor der Migration, findet seine Tabellen nicht und stirbt so
      # lange, bis der Neustart zufällig spät genug kommt.
      web:
        condition: service_healthy
    networks:
      - default
      - fsm-network
    command: python manage.py qcluster
    # Ein laufender Prozess sagt nichts darüber, ob er noch etwas tut. Geprüft
    # wird deshalb der Fahrplan selbst: Bleibt ein Job überfällig liegen,
    # arbeitet niemand die Warteschlange ab.
    healthcheck:
      test: ["CMD", "python", "manage.py", "jobs_pruefen"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 120s

volumes:
  postgres-daten:

networks:
  default:
  fsm-network:
    name: fsm-network
    external: true
